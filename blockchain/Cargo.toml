[package]
name = "bk-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.2"
clap = { version = "4.6.5", features = ["derive"] }
enum-iterator = "2.3.0"
hex = "0.4.3"
md5 = "0.8.1"
rand = "0.10.1"
rayon = "1.12.0"
rocket = { version = "0.5.1", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
# Election manifest import (ELECTION_MANIFEST.md): JSON parsing and base64url public keys.
serde_json = "1.0.145"
base64 = "0.22.1"
# LRS ballot verification (see web/src/crypto/lrs/WIRE_FORMAT.md). ristretto255 group ops.
curve25519-dalek = "4.1.3"
sha2 = "0.11.0"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = "0.7.18"
uuid = { version = "1.24.0", features = ["v4"] }
wincode = { version = "0.5.4", features = ["derive"] }
